<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Groups Menu Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="options">
      <header class="page-header">
        <h1>Tab Groups Menu</h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <section class="toolbar" aria-label="Backup">
        <button id="export-button" type="button">Export JSON</button>
        <label class="import-button">
          Import JSON
          <input id="import-input" type="file" accept="application/json,.json">
        </label>
      </section>

      <section id="groups-list" class="groups-list" aria-label="Remembered groups"></section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
