<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Groups Switcher Options</title>
    <link rel="stylesheet" href="options.css?v=4">
  </head>
  <body>
    <main class="options">
      <header class="page-header">
        <h1>Tab Groups Switcher</h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <section class="settings-panel" aria-label="Switching behavior">
        <label class="checkbox-label">
          <input id="minimize-other-groups" type="checkbox">
          <span>Minimize other tab groups when switching</span>
        </label>
      </section>

      <section id="groups-list" class="groups-list" aria-label="Open tab groups"></section>
    </main>

    <script src="options.js?v=4"></script>
  </body>
</html>
