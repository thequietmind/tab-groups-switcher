<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Groups Switcher Options</title>
    <link rel="stylesheet" href="options.css?v=3">
  </head>
  <body>
    <main class="options">
      <header class="page-header">
        <h1>Tab Groups Switcher</h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </header>

      <section class="settings-panel" aria-label="Switching behavior">
        <label class="checkbox-label">
          <input id="minimize-other-groups" type="checkbox">
          <span>Minimize other tab groups when switching</span>
        </label>

        <label class="checkbox-label">
          <input id="show-remembered-closed-groups" type="checkbox">
          <span>Show remembered closed tab groups</span>
        </label>
        <p class="helper-text">
          Experimental. Firefox does not expose native saved tab groups to
          extensions. Remembered groups are recreated from stored URLs and will
          duplicate Firefox's own saved groups when those saved groups still
          exist.
        </p>
      </section>

      <section id="groups-list" class="groups-list" aria-label="Remembered groups"></section>
    </main>

    <script src="options.js?v=3"></script>
  </body>
</html>
